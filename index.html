<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSMC 半導體與職場核心單字記憶系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff', 100: '#e0effe', 500: '#0284c7', 600: '#0265d2', 700: '#034ea2', 800: '#073674', 900: '#0a2347',
                        },
                        tsmc: {
                            red: '#e1d48', navy: '#0f172a', accent: '#06b6d4', card: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-brand-500 selection:text-white">

    <!-- Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-cyan-500 flex items-center justify-center font-bold text-white shadow-lg shadow-brand-500/30">
                    T
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight">TSMC 核心單字記憶系統</h1>
                    <p class="text-xs text-slate-400">雙語情境與間隔重複學習</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 bg-slate-800/80 p-1 rounded-xl border border-slate-700/50">
                <button onclick="switchTab('flashcard')" id="nav-flashcard" class="px-4 py-1.5 rounded-lg text-xs font-medium transition-all bg-brand-600 text-white shadow">
                    單字卡訓練
                </button>
                <button onclick="switchTab('list')" id="nav-list" class="px-4 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-white">
                    單字庫總覽
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-8 flex flex-col justify-center">

        <!-- Tab 1: Flashcard / Quiz View -->
        <section id="view-flashcard" class="space-y-6">
            <!-- Stats Dashboard -->
            <div class="grid grid-cols-4 gap-3">
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center">
                    <div class="text-xs text-slate-400 mb-1">總單字數</div>
                    <div id="stat-total" class="text-lg font-bold text-white">288</div>
                </div>
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center">
                    <div class="text-xs text-slate-400 mb-1">已掌握</div>
                    <div id="stat-mastered" class="text-lg font-bold text-emerald-400">0</div>
                </div>
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center">
                    <div class="text-xs text-slate-400 mb-1">錯題累積</div>
                    <div id="stat-errors" class="text-lg font-bold text-rose-400">0</div>
                </div>
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center">
                    <div class="text-xs text-slate-400 mb-1">進度</div>
                    <div id="stat-progress" class="text-lg font-bold text-cyan-400">0%</div>
                </div>
            </div>

            <!-- Flashcard Container -->
            <div class="perspective-1000 w-full h-[420px] cursor-pointer" onclick="flipCard()">
                <div id="card-inner" class="relative w-full h-full duration-500 transform-style-3d shadow-2xl rounded-2xl">
                    
                    <!-- Front Side -->
                    <div class="absolute inset-0 w-full h-full bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between backface-hidden">
                        <div class="flex justify-between items-center">
                            <span id="card-pos" class="px-3 py-1 bg-brand-500/10 text-brand-400 text-xs font-semibold rounded-full border border-brand-500/20">--</span>
                            <div class="flex items-center space-x-2">
                                <span id="error-badge" class="hidden px-2.5 py-0.5 bg-rose-500/10 text-rose-400 text-xs rounded-full border border-rose-500/20">錯題 0 次</span>
                                <button onclick="event.stopPropagation(); playAudio();" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                                </button>
                            </div>
                        </div>

                        <div class="text-center space-y-2">
                            <h2 id="card-word" class="text-4xl font-extrabold tracking-tight text-white">Loading...</h2>
                            <p class="text-xs text-slate-500">點擊卡片翻轉查看中文與例句</p>
                        </div>

                        <div class="text-center text-xs text-slate-400">
                            ( 點擊任意處翻牌 )
                        </div>
                    </div>

                    <!-- Back Side -->
                    <div class="absolute inset-0 w-full h-full bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between backface-hidden rotate-y-180 overflow-y-auto">
                        <div class="flex justify-between items-center">
                            <span id="card-pos-back" class="px-3 py-1 bg-brand-500/10 text-brand-400 text-xs font-semibold rounded-full border border-brand-500/20">--</span>
                            <span class="text-xs text-cyan-400 font-medium">釋義與情境例句</span>
                        </div>

                        <div class="space-y-4 my-auto">
                            <div class="text-center">
                                <h3 id="card-word-back" class="text-2xl font-bold text-white mb-1">--</h3>
                                <p id="card-meaning" class="text-xl font-medium text-cyan-300">--</p>
                            </div>

                            <!-- Context Selector -->
                            <div class="flex justify-center space-x-2 border-t border-slate-800 pt-3">
                                <button onclick="event.stopPropagation(); switchContext('daily')" id="btn-daily" class="px-3 py-1 rounded text-xs font-medium bg-brand-600 text-white transition">日常生活例句</button>
                                <button onclick="event.stopPropagation(); switchContext('fab')" id="btn-fab" class="px-3 py-1 rounded text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">晶圓製造例句</button>
                            </div>

                            <div class="bg-slate-950/60 rounded-xl p-3.5 border border-slate-800/80 space-y-1.5">
                                <p id="card-sentence" class="text-sm text-slate-200 italic">--</p>
                                <p id="card-sentence-zh" class="text-xs text-slate-400 font-medium">--</p>
                            </div>
                        </div>

                        <div class="text-center text-xs text-slate-500">
                            請評估你對這個單字的熟悉程度
                        </div>
                    </div>

                </div>
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-2 gap-4">
                <button onclick="handleAnswer(false)" class="py-3 px-4 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-400 font-semibold rounded-xl transition flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    <span>記錯 / 不熟 (加強出現)</span>
                </button>
                <button onclick="handleAnswer(true)" class="py-3 px-4 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 font-semibold rounded-xl transition flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    <span>記得 / 答對 (降低頻率)</span>
                </button>
            </div>
        </section>

        <!-- Tab 2: Vocabulary List View -->
        <section id="view-list" class="hidden space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-lg text-white">全部單字清單 (288字)</h3>
                <input type="text" id="search-input" oninput="filterVocabulary()" placeholder="搜尋英文或中文..." class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-brand-500 w-48">
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden max-h-[550px] overflow-y-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-900/90 sticky top-0 border-b border-slate-800 text-xs text-slate-400">
                        <tr>
                            <th class="p-3">#</th>
                            <th class="p-3">單字</th>
                            <th class="p-3">詞性與中文</th>
                            <th class="p-3 text-center">錯題數</th>
                        </tr>
                    </thead>
                    <tbody id="vocab-table-body" class="divide-y divide-slate-800/60 text-sm">
                        <!-- Dynamic rendered -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-800/60 mt-auto">
        TSMC Vocabulary Learning System &copy; 2026 | Spaced Repetition Engine
    </footer>

    <!-- JavaScript Application Logic -->
    <script>

            { id: 280, word: "view", pos: "v.", meaning: "查看", daily: "View scenic photos from the trip.", dailyZh: "查看旅行的風景照片。", fab: "View real-time SPC charts on the engineering terminal.", fabZh: "在工程終端機上查看即時 SPC 圖表。" },
            { id: 281, word: "wafer", pos: "n.", meaning: "晶圓", daily: "Thin wafers are sliced from silicon ingots.", dailyZh: "薄晶圓從矽晶錠切割而成。", fab: "Silicon wafers serve as the base substrate for microchips.", fabZh: "矽晶圓作為微晶片的基本基板。" },
            { id: 282, word: "waiting", pos: "n.", meaning: "等待", daily: "Thanks for waiting patiently.", dailyZh: "感謝您的耐心等待。", fab: "Wafers are waiting in the stocker for the next process.", fabZh: "晶圓在儲存櫃中等待下一個製程。" },
            { id: 283, word: "warning", pos: "n.", meaning: "警告", daily: "Pay attention to weather warnings.", dailyZh: "注意氣象警告。", fab: "System warning alerts operators to check gas pressure.", fabZh: "系統警告提醒操作員檢查氣體壓力。" },
            { id: 284, word: "weekly", pos: "adv.", meaning: "每週地", daily: "Team meetings are held weekly.", dailyZh: "團隊會議每週舉行一次。", fab: "Weekly maintenance prevents unexpected equipment failures.", fabZh: "每週保養可預防突發的設備故障。" },
            { id: 285, word: "wet", pos: "a.", meaning: "濕的", daily: "Do not touch the wet paint.", dailyZh: "不要觸摸濕油漆。", fab: "Wet bench stations use chemical solutions for cleaning.", fabZh: "濕洗工作站使用化學溶液進行清洗。" },
            { id: 286, word: "window", pos: "n.", meaning: "視窗", daily: "Open the window for fresh air.", dailyZh: "打開窗戶呼吸新鮮空氣。", fab: "Process window defines acceptable parameter limits.", fabZh: "製程視窗定義了可接受的參數極限。" },
            { id: 287, word: "yield", pos: "n.", meaning: "良率", daily: "Agricultural yield depends on weather conditions.", dailyZh: "農業產量取決於氣候條件。", fab: "High manufacturing yield is crucial for profitability.", fabZh: "高製造良率對獲利能力至關重要。" },
            { id: 288, word: "zero", pos: "n.", meaning: "零", daily: "Temperature dropped to zero degrees.", dailyZh: "溫度降到零度。", fab: "Aim for zero defects in every production batch.", fabZh: "目標在每個生產批次中達到零缺陷。" }
        ];

        let currentIndex = 0;
        let isFlipped = false;
        let currentContextType = 'daily'; // 'daily' or 'fab'
        let userProgress = JSON.parse(localStorage.getItem('tsmc_vocab_progress')) || {};

        // Initialize App
        function initApp() {
            document.getElementById('stat-total').innerText = vocabData.length;
            updateStats();
            loadCard(currentIndex);
            renderVocabularyList();
        }

        function loadCard(index) {
            const item = vocabData[index];
            isFlipped = false;
            document.getElementById('card-inner').classList.remove('rotate-y-180');

            // Front
            document.getElementById('card-pos').innerText = `#${item.id} (${item.pos})`;
            document.getElementById('card-word').innerText = item.word;
            
            const errorCount = userProgress[item.id]?.errors || 0;
            const badge = document.getElementById('error-badge');
            if (errorCount > 0) {
                badge.innerText = `錯題 ${errorCount} 次`;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            // Back
            document.getElementById('card-pos-back').innerText = `#${item.id} (${item.pos})`;
            document.getElementById('card-word-back').innerText = item.word;
            document.getElementById('card-meaning').innerText = item.meaning;

            updateSentenceDisplay(item);
        }

        function flipCard() {
            isFlipped = !isFlipped;
            const cardInner = document.getElementById('card-inner');
            if (isFlipped) {
                cardInner.classList.add('rotate-y-180');
            } else {
                cardInner.classList.remove('rotate-y-180');
            }
        }

        function switchContext(type) {
            currentContextType = type;
            const btnDaily = document.getElementById('btn-daily');
            const btnFab = document.getElementById('btn-fab');

            if (type === 'daily') {
                btnDaily.className = "px-3 py-1 rounded text-xs font-medium bg-brand-600 text-white transition";
                btnFab.className = "px-3 py-1 rounded text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
            } else {
                btnFab.className = "px-3 py-1 rounded text-xs font-medium bg-brand-600 text-white transition";
                btnDaily.className = "px-3 py-1 rounded text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
            }
            updateSentenceDisplay(vocabData[currentIndex]);
        }

        function updateSentenceDisplay(item) {
            const sentenceEl = document.getElementById('card-sentence');
            const sentenceZhEl = document.getElementById('card-sentence-zh');
            if (currentContextType === 'daily') {
                sentenceEl.innerText = `"${item.daily}"`;
                sentenceZhEl.innerText = item.dailyZh;
            } else {
                sentenceEl.innerText = `"${item.fab}"`;
                sentenceZhEl.innerText = item.fabZh;
            }
        }

        function handleAnswer(isCorrect) {
            const item = vocabData[currentIndex];
            if (!userProgress[item.id]) {
                userProgress[item.id] = { errors: 0, mastered: false };
            }

            if (!isCorrect) {
                userProgress[item.id].errors += 1;
                userProgress[item.id].mastered = false;
            } else {
                userProgress[item.id].mastered = true;
            }

            localStorage.setItem('tsmc_vocab_progress', JSON.stringify(userProgress));
            updateStats();
            renderVocabularyList();

            // Leitner Spaced Repetition Next Card Algorithm
            getNextCardIndex(isCorrect);
            loadCard(currentIndex);
        }

        function getNextCardIndex(lastWasCorrect) {
            if (!lastWasCorrect) {
                currentIndex = (currentIndex + 1) % vocabData.length;
            } else {
                let weightedPool = [];
                vocabData.forEach((vocab, idx) => {
                    let weight = 1;
                    const errs = userProgress[vocab.id]?.errors || 0;
                    const mastered = userProgress[vocab.id]?.mastered || false;
                    
                    if (errs > 0) weight += errs * 3;
                    if (mastered) weight = 0.2;

                    for (let i = 0; i < Math.ceil(weight); i++) {
                        weightedPool.push(idx);
                    }
                });
                currentIndex = weightedPool[Math.floor(Math.random() * weightedPool.length)];
            }
        }

        function updateStats() {
            let masteredCount = 0;
            let totalErrors = 0;

            vocabData.forEach(v => {
                if (userProgress[v.id]?.mastered) masteredCount++;
                totalErrors += (userProgress[v.id]?.errors || 0);
            });

            document.getElementById('stat-mastered').innerText = masteredCount;
            document.getElementById('stat-errors').innerText = totalErrors;
            document.getElementById('stat-progress').innerText = Math.round((masteredCount / vocabData.length) * 100) + '%';
        }

        function playAudio() {
            const word = vocabData[currentIndex].word;
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        function switchTab(tab) {
            const fSec = document.getElementById('view-flashcard');
            const lSec = document.getElementById('view-list');
            const nF = document.getElementById('nav-flashcard');
            const nL = document.getElementById('nav-list');

            if (tab === 'flashcard') {
                fSec.classList.remove('hidden');
                lSec.classList.add('hidden');
                nF.className = "px-4 py-1.5 rounded-lg text-xs font-medium transition-all bg-brand-600 text-white shadow";
                nL.className = "px-4 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-white";
            } else {
                fSec.classList.add('hidden');
                lSec.classList.remove('hidden');
                nL.className = "px-4 py-1.5 rounded-lg text-xs font-medium transition-all bg-brand-600 text-white shadow";
                nF.className = "px-4 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-white";
                renderVocabularyList();
            }
        }

        function renderVocabularyList(filter = '') {
            const tbody = document.getElementById('vocab-table-body');
            tbody.innerHTML = '';

            const keyword = filter.toLowerCase();
            const filtered = vocabData.filter(v => 
                v.word.toLowerCase().includes(keyword) || v.meaning.includes(keyword)
            );

            filtered.forEach(v => {
                const errs = userProgress[v.id]?.errors || 0;
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/40 transition";
                tr.innerHTML = `
                    <td class="p-3 text-slate-500 text-xs">#${v.id}</td>
                    <td class="p-3 font-semibold text-white">${v.word}</td>
                    <td class="p-3 text-slate-300"><span class="text-xs text-brand-400 mr-2">[${v.pos}]</span>${v.meaning}</td>
                    <td class="p-3 text-center"><span class="px-2 py-0.5 rounded text-xs ${errs > 0 ? 'bg-rose-500/10 text-rose-400 border border-rose-500/20' : 'text-slate-500'}">${errs}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterVocabulary() {
            const val = document.getElementById('search-input').value;
            renderVocabularyList(val);
        }

        window.onload = initApp;
    </script>
